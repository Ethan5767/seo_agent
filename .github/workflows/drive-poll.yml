# ---------------------------------------------------------------------------
# Google Drive content intake — the scheduled half of the content pipeline.
#
# WHAT THIS IS. Everything the intake code does was, until now, only reachable by
# a human typing a command. Nobody types commands at 9am on a Tuesday when the
# team drops content. This is the cron that makes an engine into a pipeline.
#
# TWO INTAKE PATHS, both run every time, because the team uses both:
#
#   1. FOLDER  `wf-drive-intake` — walks each active client's
#      `From Team/Client Work/[Month YYYY]/` and takes ONE month per run. The
#      month folder is the selector, not a date window: Drive bumps modifiedTime
#      when a file is merely MOVED, so a bulk reorg used to make six months of
#      old content look brand new (BUG-002).
#
#   2. LINK  `wf-link-intake` — the team mostly shares Google Doc LINKS in
#      Discord instead of uploading. The 2026-07-28 poll found 78 links and zero
#      DOCX. Those docs are team-owned, so from our account they have NO visible
#      parent folder and cannot be routed by folder at all. They are routed by
#      reading the document and matching brand/domain signatures from clients.yml,
#      and a folder/content disagreement is refused outright rather than guessed.
#
# QUIET BY DEFAULT. Nothing new means nothing posted. A poller that announces
# "nothing new" every hour gets muted, and a muted channel defeats the purpose.
#
# NOTHING IS EVER DROPPED. A doc for a client that is not yet pilot|active is
# still retrieved, into `inactive/<slug>/`. A doc that cannot be routed lands in
# `unrouted/` with the reason. Losing real team work because of a status flag or
# an ambiguous name is worse than a human spending a minute on triage.
#
# STATE. `.drive-intake-state.json` (Drive file id -> version fingerprint) is
# carried between runs in the Actions cache, and SHARED by both paths so a doc
# reached by link and later by folder is not taken twice. Cache is best-effort:
# if GitHub evicts it, one run re-downloads files it already had. Noisy, never
# destructive. The durable record is `docs/intake-archive/` in the client repo.
#
# CROSS-REPO WRITES ARE PR-ONLY (the operator's override, 2026-08). The original header
# here refused ANY cross-repo write from a scheduled job. That refusal left the
# last hop of the pipeline unowned — retrieved content stopped at an artifact
# and waited for a human who never came (82 delivered pages sat in limbo). Alex
# explicitly overrode it FOR PR-MEDIATED WRITES ONLY: "pipeline opens a PR on
# the client repo — PR not direct push, so a human still approves before
# deploy." The spirit of the old rule is intact and enforced in code
# (pipeline/intake/client_handoff.py):
#
#   * NEVER pushes to a client's default branch — writes land on
#     `cycle/<slug>-<YYYY-MM>` only, the same branch cycle-emit uses.
#   * NEVER merges. the operator's merge is still the only path to production.
#   * The handoff stage activates ONLY when the CLIENT_REPOS_TOKEN secret
#     exists (a fine-grained PAT scoped to the five client repos — mint spec in
#     docs/ADMIN-CHECKLIST.md §9). Without it this workflow behaves
#     exactly as before: artifact + notification, no writes anywhere.
#
# The artifact upload STAYS regardless (belt and braces against PR mishaps and
# artifact expiry never being the only copy).
#
# CONFIG. `config/drive-intake.yml` is the committed CI copy of the roster,
# generated from `meridian-seo-ops/clients.yml` (source of truth, outside this
# repo). Same pattern as the Discord channel map, same reason.
#
# SECURITY. harden-runner first; contents:read only; every action SHA-pinned;
# concurrency serialised so two runs cannot race the shared cursor.
# ---------------------------------------------------------------------------
name: Drive Content Intake

on:
  schedule:
    # Every 3 hours, NOT hourly — and the reason is billing, not politeness.
    #
    # GitHub Free gives 2,000 Actions minutes/month on private repos, and every
    # run bills a MINIMUM OF ONE MINUTE (usage rounds up per job). Measured runs
    # take ~40s, so each poll costs a full minute regardless.
    #
    #   hourly       730 runs/mo = 730 min   ← 37% of the whole free tier, per poller
    #   every 3h     244 runs/mo = 244 min
    #
    # With the Discord poller also on hourly, two crons that usually find nothing
    # would consume ~1,460 of 2,000 minutes, leaving ~540 for CI and every client
    # quality gate. Content drops are roughly MONTHLY; a 3-hour worst-case delay
    # on a monthly event is irrelevant, and workflow_dispatch is always there when
    # someone wants it now.
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: "Pin a cycle month as YYYY-MM (blank = latest non-future month folder)"
        required: false
        type: string
      dry_run:
        description: "Resolve and report only — download nothing, write no state"
        required: false
        type: boolean
        default: false
      force:
        description: "Ignore the ingest ledger and re-fetch everything"
        required: false
        type: boolean
        default: false
      settle_hours:
        description: "Hold back docs edited in the last N hours (0 disables the quiet period)"
        required: false
        default: '6'
        type: string

permissions:
  contents: read

concurrency:
  group: drive-poll-${{ github.repository }}
  cancel-in-progress: false

env:
  INTAKE_DIR: intake
  CONFIG_FILE: config/drive-intake.yml

jobs:
  poll:
    name: Poll Drive for new team content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # A scheduled cron must not fail every hour waiting on a human to add
      # secrets. It stays green and activates itself once they exist.
      - name: Resolve config
        id: cfg
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          PIPELINE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.PIPELINE_DRIVE_PARENT_FOLDER_ID }}
        run: |
          set -uo pipefail
          missing=""
          [ -f "${CONFIG_FILE}" ] || missing="${missing} ${CONFIG_FILE}"
          [ -n "${DRIVE_CLIENT_ID:-}" ]     || missing="${missing} DRIVE_CLIENT_ID"
          [ -n "${DRIVE_CLIENT_SECRET:-}" ] || missing="${missing} DRIVE_CLIENT_SECRET"
          [ -n "${DRIVE_REFRESH_TOKEN:-}" ] || missing="${missing} DRIVE_REFRESH_TOKEN"
          [ -n "${PIPELINE_DRIVE_PARENT_FOLDER_ID:-}" ] || missing="${missing} PIPELINE_DRIVE_PARENT_FOLDER_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Drive intake not configured yet; skipping (run stays green). Missing:${missing}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pipeline package
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e ".[intake]"

      # Restore the ingest ledger ONLY — never the content. Content lives in the
      # artifact and, durably, in the client repo.
      - name: Restore intake ledger
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.INTAKE_DIR }}/.drive-intake-state.json
          key: drive-intake-ledger-${{ github.run_id }}
          restore-keys: |
            drive-intake-ledger-

      - name: Folder intake — one month per active client
        if: steps.cfg.outputs.ready == 'true'
        id: folder
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          PIPELINE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.PIPELINE_DRIVE_PARENT_FOLDER_ID }}
        run: |
          set -uo pipefail
          ARGS=(--clients-yml "${CONFIG_FILE}" --intake-dir "${INTAKE_DIR}")
          [ -n "${{ inputs.month }}" ] && ARGS+=(--month "${{ inputs.month }}")
          [ "${{ inputs.force }}" = "true" ] && ARGS+=(--force)
          ARGS+=(--settle-hours "${{ inputs.settle_hours || '6' }}")
          wf-drive-intake "${ARGS[@]}" | tee folder-intake.log
          echo "new=$(grep -c '^ROUTED:' folder-intake.log || true)" >> "$GITHUB_OUTPUT"

      # Links posted in Discord. Routed by folder if possible, otherwise by
      # reading the document — team-owned shares have no parent we can see.
      - name: Link intake — shared Google Docs
        if: steps.cfg.outputs.ready == 'true'
        id: links
        continue-on-error: true
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          PIPELINE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.PIPELINE_DRIVE_PARENT_FOLDER_ID }}
        run: |
          set -uo pipefail
          if [ ! -s "${INTAKE_DIR}/drive-links.txt" ]; then
            echo "no drive-links.txt — nothing shared via link this run"
            echo "new=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ARGS=(--clients-yml "${CONFIG_FILE}" --intake-dir "${INTAKE_DIR}"
                --links-file "${INTAKE_DIR}/drive-links.txt")
          [ "${{ inputs.force }}" = "true" ] && ARGS+=(--force)
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          ARGS+=(--settle-hours "${{ inputs.settle_hours || '6' }}")
          wf-link-intake "${ARGS[@]}" | tee link-intake.log
          echo "new=$(grep -c '^ROUTED:' link-intake.log || true)" >> "$GITHUB_OUTPUT"

      # Quiet by default: only upload when something actually arrived.
      - name: Upload retrieved content
        if: steps.cfg.outputs.ready == 'true' && (steps.folder.outputs.new != '0' || steps.links.outputs.new != '0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drive-intake-${{ github.run_id }}
          path: |
            ${{ env.INTAKE_DIR }}/**
            *.log
          retention-days: 30

      # ---- HANDOFF STAGE (the operator's 2026-08 decision — see the header) ----------
      # Retrieved DOCX -> `cycle/<slug>-<YYYY-MM>` branch + intake PR on the
      # client repo + cycle-emit dispatch. Gated EXACTLY like the Drive token
      # gate above: no CLIENT_REPOS_TOKEN, no handoff, run stays green.
      - name: Resolve handoff token
        id: handoff-cfg
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLIENT_REPOS_TOKEN: ${{ secrets.CLIENT_REPOS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLIENT_REPOS_TOKEN:-}" ]; then
            echo "::notice::CLIENT_REPOS_TOKEN is not set — retrieved content stops at the artifact (no client-repo PRs). Mint it per docs/ADMIN-CHECKLIST.md §9 to activate the handoff stage, then re-run with force=true to hand off already-ingested docs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs BEFORE the ledger save on purpose: a failed handoff fails the run,
      # the ledger is not saved, and the next poll re-downloads and RETRIES the
      # handoff. Every write it makes is idempotent (content-sha compare, one PR
      # per client per month), so the retry is safe. It shallow-clones each
      # client repo (depth 1, read-only) into .clients/<slug> so wf-preflight-docx
      # runs against that client's own config — the same checkouts
      # config/discord-intake.yml `preflight.projects` now points at.
      - name: Hand off to client repos (branch + DOCX + intake PR + cycle-emit)
        id: handoff
        if: >-
          steps.cfg.outputs.ready == 'true' &&
          steps.handoff-cfg.outputs.ready == 'true' &&
          (steps.folder.outputs.new != '0' || steps.links.outputs.new != '0')
        env:
          CLIENT_REPOS_TOKEN: ${{ secrets.CLIENT_REPOS_TOKEN }}
          HANDOFF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          ARGS=(--intake-dir "${INTAKE_DIR}" --clients-yml "${CONFIG_FILE}" --clones-dir .clients)
          [ -n "${{ inputs.month }}" ] && ARGS+=(--cycle "${{ inputs.month }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          wf-client-handoff "${ARGS[@]}" | tee handoff.log
          exit "${PIPESTATUS[0]}"

      # Saved AFTER the artifact so a failed upload cannot mark files as ingested.
      # The artifact is the system of record; the ledger is only an optimisation.
      - name: Save intake ledger
        if: steps.cfg.outputs.ready == 'true' && inputs.dry_run != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.INTAKE_DIR }}/.drive-intake-state.json
          key: drive-intake-ledger-${{ github.run_id }}

      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "### Drive intake"
            echo ""
            echo "| Path | New files |"
            echo "|---|---:|"
            echo "| Folder (\`From Team/Client Work\`) | ${{ steps.folder.outputs.new || 0 }} |"
            echo "| Shared links | ${{ steps.links.outputs.new || 0 }} |"
            echo ""
            grep -hE '^(HELD|UNROUTED|SETTLING|WARN|NOTE):' *.log 2>/dev/null \
              | sed 's/^/- /' || echo "_nothing needing attention_"
            if [ -f handoff.log ]; then
              echo ""
              echo "### Handoff (client-repo intake PRs)"
              echo ""
              grep -hE '^(HANDOFF|COMMITTED|UNCHANGED|PR|DISPATCHED|DRY-RUN|ERROR):' handoff.log 2>/dev/null \
                | sed 's/^/- /' || echo "_no handoff activity_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
