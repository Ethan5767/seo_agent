<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Client · wf-dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<link href="/static/theme.css" rel="stylesheet"/>
</head>
<body class="font-body-md text-body-md antialiased">
<main class="md:ml-60 pt-12 min-h-screen flex flex-col bg-background">
<div id="header"></div>
<div class="p-md flex flex-col gap-md">
  <section class="border border-outline-variant rounded bg-surface-container-low">
    <div class="px-md py-sm border-b border-outline-variant flex items-center gap-md">
      <span class="font-label-caps text-label-caps text-on-surface-variant">CYCLE</span>
      <select id="cycle" class="bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary"></select>
    </div>
    <div id="artifacts" class="p-md grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-md"></div>
  </section>
  <section class="border border-outline-variant rounded bg-surface-container-low">
    <div class="px-md py-sm border-b border-outline-variant font-label-caps text-label-caps text-on-surface-variant">CLIENT CONFIG</div>
    <div id="config" class="p-md"></div>
  </section>
</div>
</main>
<script src="/static/app.js"></script>
<script src="/static/page-client.js"></script>
</body></html>
