# ---------------------------------------------------------------------------
# CI (self-test) — the pipeline engine tests ITSELF.
#
# The client-facing gates protect client sites; NOTHING protected the gates.
# A silent regression in a gate (e.g. the forbidden-sweep <script>/<style>
# masking becoming a no-op) is worse than no gate — it ships false confidence.
# This workflow runs tests/ on every push and PR so the gates cannot regress
# unnoticed. It builds nothing and deploys nothing; it only installs the package
# and runs pytest.
#
# Security posture (mirrors the reusable workflows in this repo):
#   - step-security/harden-runner as step 1, egress audited.
#   - Least-privilege: contents:read only (no write scope; never deploys).
#   - Every action SHA-pinned (dependabot.yml watches the github-actions SHAs).
#   - Triggered on push/pull_request only — never pull_request_target, so a fork
#     PR cannot run with repo secrets. This job declares/uses no secrets at all.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt

      - name: Run the gate/emitter test suite
        run: pytest -q
