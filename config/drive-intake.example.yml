# ---------------------------------------------------------------------------
# Drive intake roster — NON-SECRET. Copy to config/drive-intake.yml and commit
# it. Folder ids and client slugs are not credentials — access is governed by
# the OAuth token, not by knowing the id. The OAuth client secret and refresh
# token ARE credentials and live only in repo secrets (DRIVE_CLIENT_ID /
# DRIVE_CLIENT_SECRET / DRIVE_REFRESH_TOKEN). Never put a token in this file.
#
# If your client roster's source of truth lives outside this repo (Model A),
# regenerate this copy whenever it changes — a client listed there and not
# here is silently not polled.
#
# `repo:` is the client's GitHub repo — where the handoff stage opens the
# monthly `cycle/<slug>-<YYYY-MM>` intake PR. A client without `repo:` is
# still polled, but its docs stop at the artifact (no PR).
#
# Consumed by:
#   pipeline/intake/drive_intake.py --config
#   .github/workflows/drive-poll.yml
# ---------------------------------------------------------------------------

drive:
  parent_folder_id: REPLACE_WITH_DRIVE_FOLDER_ID

clients:
- slug: example-client
  domain: example.com
  aliases:
  - example company
  - example
  drive_folder_id: REPLACE_WITH_DRIVE_FOLDER_ID
  repo: your-org/example-client-site
  # drive-poll only processes pilot|active; queued clients are listed but
  # skipped — flip this deliberately, it decides who a backlog flush covers.
  pipeline_status: pilot

- slug: second-example
  domain: second-example.com
  aliases:
  - second example
  drive_folder_id: REPLACE_WITH_DRIVE_FOLDER_ID
  repo: your-org/second-example-site
  pipeline_status: queued
