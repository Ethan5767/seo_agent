<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fleet · wf-dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script src="/static/theme.js"></script>
<link href="/static/theme.css" rel="stylesheet"/>
</head>
<body class="font-body-md text-body-md antialiased">
<main class="md:ml-60 pt-12 min-h-screen flex flex-col bg-background">
<!-- Toolbar -->
<div class="h-12 border-b border-outline-variant bg-surface-container flex items-center px-md justify-between shrink-0">
<div class="flex items-center gap-md w-full max-w-md">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<input id="filter" class="bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs w-full focus:outline-none focus:border-primary placeholder:text-on-surface-variant/50" placeholder="Filter clients..." type="text"/>
</div>
<div class="flex gap-sm items-center">
<span id="count" class="font-mono-sm text-mono-sm text-on-surface-variant"></span>
<button id="refresh" class="bg-surface-container-highest border border-outline-variant text-on-surface font-label-caps text-label-caps px-md py-sm rounded hover:bg-surface-bright transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 14px;">refresh</span> REFRESH
</button>
<button id="add" class="bg-primary-container text-on-primary-container border border-outline-variant font-label-caps text-label-caps px-md py-sm rounded hover:bg-surface-bright transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 14px;">add</span> ADD CLIENT
</button>
</div>
</div>
<!-- Onboard — wf-onboard, the one command that runs without a client -->
<div id="add-panel" class="hidden border-b border-outline-variant bg-surface-container-low p-md shrink-0">
<div class="grid grid-cols-1 lg:grid-cols-3 gap-md mb-md">
<label class="block"><span class="font-label-caps text-label-caps text-on-surface-variant">GITHUB REPO</span>
<input id="ob-repo" class="w-full mt-xs bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary" placeholder="acme/roofing-site  ·  https://github.com/acme/roofing-site" type="text"/></label>
<label class="block"><span class="font-label-caps text-label-caps text-on-surface-variant">LIVE DOMAIN</span>
<input id="ob-domain" class="w-full mt-xs bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary" placeholder="acmeroofing.com" type="text"/></label>
<label class="block"><span class="font-label-caps text-label-caps text-on-surface-variant">GITHUB TOKEN — OPTIONAL</span>
<input id="ob-token" class="w-full mt-xs bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary" placeholder="leave blank if gh is already logged in" type="password" autocomplete="new-password"/></label>
</div>
<!-- Tier — the agent's authority over this repo. T1 by default: raising a tier is
     a deliberate act. The deny floor holds at every tier, so the agent still can
     never edit this file and raise itself. -->
<div class="border-t border-outline-variant pt-md mb-md">
<span class="font-label-caps text-label-caps text-on-surface-variant">AGENT TIER</span>
<div id="ob-tiers" class="flex gap-sm mt-xs flex-wrap"></div>
<div id="ob-tier-note" class="font-body-sm text-body-sm text-on-surface-variant/70 mt-xs"></div>
<div id="ob-content" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-md mt-md">
<label class="block"><span class="font-label-caps text-label-caps text-on-surface-variant">CONTENT LOCATION</span>
<input id="ob-location" class="w-full mt-xs bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary" placeholder="src/content/blog/" type="text"/>
<span class="font-body-sm text-body-sm text-on-surface-variant/70">Where the agent may CREATE pages.</span></label>
<label class="block"><span class="font-label-caps text-label-caps text-on-surface-variant">CONTENT REGISTRY</span>
<input id="ob-registry" class="w-full mt-xs bg-surface-container-highest border border-outline-variant text-on-surface font-mono-base text-mono-base rounded px-sm py-xs focus:outline-none focus:border-primary" placeholder="src/data/posts.ts  (space or comma separated)" type="text"/>
<span class="font-body-sm text-body-sm text-on-surface-variant/70">The nav/data file a new page is wired into, or <code class="font-mono-sm">orphan_check</code> refuses the PR.</span></label>
</div>
</div>
<div class="flex gap-md items-center flex-wrap">
<button id="ob-run" class="bg-primary text-on-primary font-label-caps text-label-caps px-md py-sm rounded hover:opacity-90 transition-opacity">ONBOARD</button>
<span id="ob-exit"></span>
<span class="font-body-sm text-body-sm text-on-surface-variant/70">Clone, config, preflight, measure, plan. The token is passed to this run's environment only: never stored, never logged, never written to a repo. Re-enter it next time.</span>
</div>
<pre id="ob-log" class="hidden mt-md max-h-80 overflow-auto bg-background border border-outline-variant rounded p-sm font-mono-sm text-mono-sm whitespace-pre-wrap"></pre>
</div>
<!-- Client Grid -->
<div class="flex-1 overflow-auto p-panel-padding">
<div id="grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-gutter"></div>
<div id="empty"></div>
</div>
</main>
<script src="/static/app.js"></script>
<script src="/static/page-fleet.js"></script>
</body></html>
