# ---------------------------------------------------------------------------
# Cycle Emit (REUSABLE, workflow_call) — distill -> classify -> brief -> emit,
# then open a PR in the CLIENT repo.
#
# WHAT THIS CLOSES. `distill`, `classify`, `brief` and `emit_ts` had working
# CLIs and no workflow. A content cycle therefore required a laptop, a checkout
# and someone typing four commands in the right order. This is the workflow that
# makes the middle of the pipeline run without one. It is the last structural
# gap between `drive-poll.yml` (intake) and `quality-gate.yml` (gates).
#
# WHY THIS IS PER-CLIENT, NOT FLEET-WIDE. The emit step WRITES into a client
# repo. So this lives as a THIN CALLER inside each client repo (see
# ../examples/cycle-emit.yml) and uses that repo's OWN built-in GITHUB_TOKEN —
# write scope, that repo only. NO CROSS-REPO WRITE PAT EVER REACHES THIS
# WORKFLOW. The only secret it consumes is the read-only PIPELINE_REPO_TOKEN
# used for the second (pipeline) checkout, the same one
# quality-gate.reusable.yml already uses. (The 2026-08 handoff stage's
# CLIENT_REPOS_TOKEN lives in the PIPELINE repo only, is PR-mediated by design,
# and is never declared or consumed here.)
#
# WORKFLOW_DISPATCH ONLY — NEVER SCHEDULED, and never cron-dispatched into a
# merge: since 2026-08 the drive-poll handoff stage MAY dispatch this workflow
# on the `cycle/<slug>-<YYYY-MM>` branch it committed the intake DOCX to (the operator's
# PR-only override — see drive-poll.yml's header), so the emitted pages ripen
# the intake PR in place. Merging remains a human decision either way.
#
# WHAT IT NEVER DOES: never pushes to main, never merges, never deploys. Its only
# write is a `cycle/<slug>-<YYYY-MM>` branch and a pull request. The client's own
# quality-gate.yml then runs on that PR, and the operator's merge is still the gate to
# production.
#
# RERUN SAFETY. Step one is `wf-cycle-status --claim emit`. Exit 3 means the other
# operator already ran emit this cycle, and the job exits CLEAN without touching
# anything. Two Operators, One Pipeline (CLAUDE.md) is enforced here, not assumed.
#
# EXIT-CODE CONTRACT (the emitter's, honoured literally — see
# pipeline/generate/emit_ts.py and docs/gate-reference.md):
#
#   exit | meaning                          | this workflow does
#   -----|----------------------------------|--------------------------------
#     0  | every draft emitted clean        | commit + PR
#     1  | emitted, warn flags in the ledger| commit + PR (flags in the body)
#    15  | some pages HELD for curation     | commit + PR for what DID emit;
#        |                                  | held pages surfaced, never green
#     9  | REFUSED — a BLOCK finding        | NO PR. Fail the run, upload the
#        |                                  | curation queue as the fix list.
#    16  | unsegmentable DOCX / 0 pages     | NO PR. Fail the run.
#     2  | usage / input / dependency error | NO PR. Fail the run.
#
# The emitter also prints a stable, parseable `EMIT_SUMMARY emitted=.. held=..
# blocked=.. flagged=.. exit=..` line. This workflow parses it AND cross-checks it
# against the process exit status, and fails loudly if the two ever disagree —
# a silent divergence there would let a refused cycle open a PR.
#
# DRY RUN (the default). `dry_run: true` runs the whole chain, prints the exact
# diff and the verdict, uploads the artifact, and commits nothing and opens
# nothing. The default is deliberately the safe one: the first run against any
# client should be a dry run.
#
# Security: harden-runner first; every `uses:` SHA-pinned; workflow-level
# permissions are read-only and the single job escalates only `contents: write`
# (branch push) + `pull-requests: write` (gh pr create); concurrency is keyed per
# client and does NOT cancel in progress — cancelling mid-commit is how you get a
# half-written branch.
# ---------------------------------------------------------------------------
name: Cycle Emit (reusable)

on:
  workflow_call:
    inputs:
      client_slug:
        description: "Client slug, exactly as used in docs/cycle-logs/<YYYY-MM>/cycle-state.json."
        required: true
        type: string
      source_doc:
        description: "Path to the team handoff DOCX INSIDE the client repo, relative (e.g. docs/intake/2026-07-handoff.docx)."
        required: true
        type: string
      pipeline_ref:
        description: >-
          Ref of richardnhek/seo-content-pipeline to install. Leave empty to use
          github.job_workflow_sha (the exact commit of THIS file), falling back to
          the PIPELINE_REF stamped below at tag-cut time.
        required: false
        type: string
        default: ""
      dry_run:
        description: "true = run everything, write nothing, open nothing. THE DEFAULT."
        required: false
        type: boolean
        default: true
      limit:
        description: "Cap the number of pages distilled/emitted. 0 = no cap."
        required: false
        type: number
        default: 0
      register_routes:
        description: >-
          Splice the emitted page into its DYNAMIC route file so it actually builds.
          With dynamicParams=false an unregistered page 404s, and the emitter REFUSES
          (exit 9) rather than ship one, so the CI default is true. Set false to make
          route registration a hand step.
        required: false
        type: boolean
        default: true
      cycle:
        description: "Cycle as YYYY-MM. Empty = current month (UTC)."
        required: false
        type: string
        default: ""
      python_version:
        description: "Python version used to install and run the pipeline."
        required: false
        type: string
        default: "3.12"
    secrets:
      PIPELINE_REPO_TOKEN:
        description: >-
          Read-only PAT for richardnhek/seo-content-pipeline, used ONLY for the
          second (pipeline) checkout. Required while the pipeline repo is private:
          a client repo's GITHUB_TOKEN cannot read a different private repo. This
          is the ONLY secret this workflow declares — there is deliberately no
          cross-repo WRITE token anywhere in this design.
        required: false

# Workflow-level default is read-only. The one job escalates, and only it.
permissions:
  contents: read

concurrency:
  # Per CLIENT, not per repo-and-PR: two cycles for the same client must never
  # interleave (they write the same data files and the same cycle-state.json).
  # cancel-in-progress is FALSE on purpose — cancelling a run that has already
  # committed leaves a branch nobody opened a PR for.
  group: cycle-emit-${{ github.repository }}-${{ inputs.client_slug }}
  cancel-in-progress: false

env:
  # STAMPED PIPELINE_REF — deterministic fallback for github.job_workflow_sha,
  # advanced at every tag-cut. Same mechanism as quality-gate.reusable.yml.
  PIPELINE_REF: "v2.1.0"
  PIPELINE_REPO: "richardnhek/seo-content-pipeline"

jobs:
  cycle-emit:
    name: Cycle Emit (distill -> classify -> brief -> emit -> PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write      -> push the cycle/<slug>-<YYYY-MM> BRANCH only. Branch
      #                         protection / the required quality-gate check still
      #                         stand between this branch and main; this token can
      #                         open a PR, it cannot merge one.
      # pull-requests: write -> `gh pr create`.
      # Nothing else is granted. No packages, no deployments, no actions:write.
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-sudo: true

      # CHECKOUT 1 — the CLIENT repo (a reusable workflow's steps run in the
      # caller's context). persist-credentials stays TRUE here, unlike the gate
      # workflows: this job has to push a branch, and that is the token it uses.
      - name: Checkout client repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve pipeline ref
        id: pipe
        env:
          INPUT_REF: ${{ inputs.pipeline_ref }}
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          STAMPED_REF: ${{ env.PIPELINE_REF }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          [ -z "$REF" ] && REF="${JOB_WORKFLOW_SHA:-}"
          if [ -z "$REF" ]; then
            REF="${STAMPED_REF:-}"
            echo "::warning::github.job_workflow_sha was empty — falling back to the stamped PIPELINE_REF '${REF}'."
          fi
          if [ -z "$REF" ]; then
            echo "::error::No pipeline ref could be resolved. Refusing to run a cycle from an unknown pipeline version."
            exit 1
          fi
          echo "Pipeline ref: ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      # CHECKOUT 2 — the PIPELINE, version-locked. Client repos vendor NO scripts.
      - name: Checkout pipeline (version-locked)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.PIPELINE_REPO }}
          ref: ${{ steps.pipe.outputs.ref }}
          path: .pipeline
          persist-credentials: false
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pipeline package
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          # Base package + python-docx ONLY. Deliberately NOT the [intake] extra:
          # distill reads the DOCX through python-docx, and nothing in the
          # distill/classify/brief/emit chain imports docling. Installing the full
          # extra would pull the docling ML stack (hundreds of MB) into every run
          # for code this job never executes.
          python3 -m pip install --quiet ./.pipeline "python-docx>=1.1"
          echo "Installed pipeline from ref ${{ steps.pipe.outputs.ref }}"
          for c in wf-distill wf-classify wf-brief wf-emit-ts wf-cycle-status; do
            command -v "$c" >/dev/null || { echo "::error::$c is not on PATH after install"; exit 1; }
          done

      - name: Verify the source document exists
        env:
          SOURCE_DOC: ${{ inputs.source_doc }}
        run: |
          set -euo pipefail
          case "$SOURCE_DOC" in
            /*|*..*) echo "::error::source_doc must be a relative path inside the client repo (got '${SOURCE_DOC}')."; exit 1 ;;
          esac
          if [ ! -f "$SOURCE_DOC" ]; then
            echo "::error::source_doc not found in this repo: ${SOURCE_DOC}. Commit the handoff DOCX (docs/intake/) before starting a cycle."
            exit 1
          fi
          echo "Source doc: ${SOURCE_DOC} ($(wc -c < "$SOURCE_DOC") bytes)"

      # --- The claim. A rerun MUST be a safe no-op. ---------------------------
      # exit 0 = run it, exit 3 = the other operator already did emit this cycle.
      # Exit 3 is NOT a failure: the job continues and every later step short-
      # circuits on steps.claim.outputs.run, so the run ends green having changed
      # nothing. (CLAUDE.md, "Two Operators, One Pipeline".)
      - name: Claim the emit step
        id: claim
        env:
          SLUG: ${{ inputs.client_slug }}
          CYCLE: ${{ inputs.cycle }}
        run: |
          set +e
          if [ -n "$CYCLE" ]; then
            wf-cycle-status . --client "$SLUG" --cycle "$CYCLE" --claim emit --no-fetch
          else
            wf-cycle-status . --client "$SLUG" --claim emit --no-fetch
          fi
          rc=$?
          set -e
          case "$rc" in
            0) echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            3) echo "run=false" >> "$GITHUB_OUTPUT"
               echo "::notice::emit is already done for this cycle — nothing to do. This rerun is a no-op." ;;
            *) echo "::error::wf-cycle-status --claim emit failed with exit ${rc}"; exit "$rc" ;;
          esac

      - name: Prepare work dir
        if: steps.claim.outputs.run == 'true'
        run: mkdir -p "${RUNNER_TEMP}/cycle"

      # --- 1/4 distill: DOCX -> drafts.json -----------------------------------
      # Intermediates live in RUNNER_TEMP, never in the client repo — the commit
      # below is an allow-list, and drafts.json is not on it.
      #
      # distill exits 9 when any draft carries a BLOCKING finding. That is NOT the
      # abort here: the emitter is the authority on refusal, and it is the emitter
      # that writes docs/briefs/_curation.md, which is the artifact a human needs
      # in order to fix the source doc. Aborting at distill would throw that away.
      # exit 16 (unsegmentable) DOES abort — nothing downstream can run.
      - name: "1/4 distill (DOCX -> drafts)"
        id: distill
        if: steps.claim.outputs.run == 'true'
        env:
          SOURCE_DOC: ${{ inputs.source_doc }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set +e
          LIMIT_ARG=""
          if [ -n "${LIMIT:-}" ] && [ "${LIMIT}" != "0" ]; then LIMIT_ARG="--limit ${LIMIT}"; fi
          # shellcheck disable=SC2086
          wf-distill "$SOURCE_DOC" --out "${RUNNER_TEMP}/cycle/drafts.json" --project-dir . $LIMIT_ARG
          rc=$?
          set -e
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "16" ]; then
            echo "::error::distill exit 16 — the DOCX could not be segmented into pages. No PR will be opened."
            exit 16
          fi
          if [ "$rc" != "0" ] && [ "$rc" != "1" ] && [ "$rc" != "9" ]; then
            echo "::error::distill failed with exit ${rc}"; exit "$rc"
          fi
          echo "distill exit ${rc} (9 = blocking findings present; the emitter decides what ships)"

      # --- 2/4 classify: drafts -> decisions.json (NEW/UPDATE/SKIP/INVALID) ---
      - name: "2/4 classify (drafts -> decisions)"
        id: classify
        if: steps.claim.outputs.run == 'true'
        run: |
          set +e
          wf-classify "${RUNNER_TEMP}/cycle/drafts.json" --project . \
            --out "${RUNNER_TEMP}/cycle/decisions.json"
          rc=$?
          set -e
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
            echo "::error::classify failed with exit ${rc}"; exit "$rc"
          fi

      # --- 3/4 brief: drafts -> docs/briefs/*.json (§19) ----------------------
      # --project is the CLIENT dir, so trade / state / NAP / allow-lists all come
      # from that client's own docs/client-config.yml. Nothing about the trade or
      # the state is assumed anywhere in this chain (BUG-016).
      - name: "3/4 brief (drafts -> docs/briefs)"
        id: brief
        if: steps.claim.outputs.run == 'true'
        run: |
          set +e
          BRIEF_ARGS=""
          if [ "${DRY_RUN}" = "true" ]; then BRIEF_ARGS="--dry-run"; fi
          # shellcheck disable=SC2086
          wf-brief "${RUNNER_TEMP}/cycle/drafts.json" --project . $BRIEF_ARGS
          rc=$?
          set -e
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "1" ] && [ "$rc" != "9" ]; then
            echo "::error::brief failed with exit ${rc}"; exit "$rc"
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      # --- 4/4 emit: drafts + decisions -> typed TS data in the client repo ----
      # continue-on-error so the verdict step below owns the branch decision. The
      # exit status is captured, never swallowed.
      - name: "4/4 emit_ts (write typed data)"
        id: emit
        if: steps.claim.outputs.run == 'true'
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTER_ROUTES: ${{ inputs.register_routes }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set +e
          ARGS=""
          if [ "${DRY_RUN}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi
          if [ "${REGISTER_ROUTES}" = "true" ]; then ARGS="${ARGS} --register-routes"; fi
          if [ -n "${LIMIT:-}" ] && [ "${LIMIT}" != "0" ]; then ARGS="${ARGS} --limit ${LIMIT}"; fi
          # shellcheck disable=SC2086
          wf-emit-ts "${RUNNER_TEMP}/cycle/drafts.json" "${RUNNER_TEMP}/cycle/decisions.json" \
            --project . $ARGS 2>&1 | tee "${RUNNER_TEMP}/cycle/emit.log"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "exit=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # --- THE VERDICT: exit code -> action -----------------------------------
      # One place decides whether a PR happens, and it is driven by nothing but
      # the emitter's exit code plus the EMIT_SUMMARY line it printed. This step's
      # script is asserted directly by tests/test_cycle_emit_workflow.py, which
      # extracts THIS run block and executes it against every code in the table.
      - name: Verdict (exit code -> action)
        id: verdict
        if: always() && steps.claim.outputs.run == 'true'
        env:
          EMIT_EXIT: ${{ steps.emit.outputs.exit }}
          EMIT_LOG: ${{ runner.temp }}/cycle/emit.log
        run: |
          set -euo pipefail
          rc="${EMIT_EXIT:-2}"

          emitted=0; held=0; blocked=0; flagged=0; summary_exit=""
          if [ -f "$EMIT_LOG" ]; then
            line="$(grep -m1 '^EMIT_SUMMARY ' "$EMIT_LOG" || true)"
            if [ -n "$line" ]; then
              for kv in $line; do
                case "$kv" in
                  emitted=*) emitted="${kv#emitted=}" ;;
                  held=*)    held="${kv#held=}" ;;
                  blocked=*) blocked="${kv#blocked=}" ;;
                  flagged=*) flagged="${kv#flagged=}" ;;
                  exit=*)    summary_exit="${kv#exit=}" ;;
                esac
              done
            fi
          fi

          # The emitter prints its verdict twice on purpose. If the printed verdict
          # and the process status ever disagree, something is very wrong and the
          # safe reading is "do not open a PR".
          if [ -n "$summary_exit" ] && [ "$summary_exit" != "$rc" ]; then
            echo "::error::EMIT_SUMMARY says exit=${summary_exit} but the process exited ${rc}. Refusing to act on a contradictory verdict."
            proceed=false
            reason="contradictory verdict (EMIT_SUMMARY exit=${summary_exit} vs process exit=${rc})"
            rc=2
          else
            case "$rc" in
              0)  proceed=true;  reason="every draft emitted clean" ;;
              1)  proceed=true;  reason="emitted with warn flags in the ledger" ;;
              15) proceed=true;  reason="${held} page(s) HELD for curation — they did NOT ship; this is never green" ;;
              9)  proceed=false; reason="REFUSED — ${blocked} page(s) carry a BLOCK finding; nothing was written for them" ;;
              16) proceed=false; reason="unsegmentable input — 0 pages; nothing to emit" ;;
              2)  proceed=false; reason="usage / input / dependency error" ;;
              *)  proceed=false; reason="unexpected emitter exit ${rc}" ;;
            esac
          fi

          {
            echo "proceed=${proceed}"
            echo "rc=${rc}"
            echo "emitted=${emitted}"
            echo "held=${held}"
            echo "blocked=${blocked}"
            echo "flagged=${flagged}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"
          echo "verdict: exit=${rc} proceed=${proceed} — ${reason}"

      # --- The artifact: the fix list a human actually needs -------------------
      # Uploaded on EVERY outcome, especially 9/16. On a refusal this IS the
      # deliverable: docs/briefs/_curation.md names the offending text and a
      # concrete proposed fix per page.
      - name: Upload curation queue + logs
        if: always() && steps.claim.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycle-emit-${{ inputs.client_slug }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            docs/briefs/_curation.md
            ${{ runner.temp }}/cycle/emit.log
            ${{ runner.temp }}/cycle/drafts.json
            ${{ runner.temp }}/cycle/decisions.json

      # --- Commit + PR. Only on 0 / 1 / 15, only when something emitted. -------
      # Allow-list, not `git add -A`. Only the emitted data files, the briefs and
      # the cycle log may enter this commit; anything else the run happened to
      # touch is reported and left behind.
      - name: Commit emitted files to a cycle branch
        id: commit
        if: >-
          steps.claim.outputs.run == 'true' &&
          steps.verdict.outputs.proceed == 'true' &&
          inputs.dry_run == false
        env:
          SLUG: ${{ inputs.client_slug }}
          CYCLE: ${{ inputs.cycle }}
          EMITTED: ${{ steps.verdict.outputs.emitted }}
          HELD: ${{ steps.verdict.outputs.held }}
        run: |
          set -euo pipefail
          CYCLE_ID="${CYCLE:-$(date -u +%Y-%m)}"
          BRANCH="cycle/${SLUG}-${CYCLE_ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Mark BEFORE committing so the cycle log rides along in the same commit.
          # CLAUDE.md: marking a step and not pushing it is worse than not marking
          # it. Here the mark and the push are one operation.
          wf-cycle-status . --client "$SLUG" --cycle "$CYCLE_ID" \
            --mark emit --status done \
            --detail "${EMITTED} emitted, ${HELD} held" --no-fetch

          git checkout -B "$BRANCH"

          ADDED=0
          SKIPPED=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              src/data/*|docs/briefs/*|docs/cycle-logs/*|src/app/*/page.tsx)
                git add -- "$path"; ADDED=$((ADDED+1)) ;;
              *)
                SKIPPED="${SKIPPED} ${path}" ;;
            esac
          done < <(git status --porcelain --untracked-files=all | cut -c4-)

          if [ -n "$SKIPPED" ]; then
            echo "::warning::Not committed (outside the emit allow-list):${SKIPPED}"
          fi
          if [ "$ADDED" -eq 0 ] || git diff --cached --quiet; then
            echo "::notice::Nothing to commit — the emitter produced no file changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "cycle(${SLUG}): ${CYCLE_ID} — ${EMITTED} emitted, ${HELD} held" \
                     -m "Emitted by cycle-emit.reusable.yml @ ${{ steps.pipe.outputs.ref }}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --force-with-lease origin "$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "cycle_id=${CYCLE_ID}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.client_slug }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          CYCLE_ID: ${{ steps.commit.outputs.cycle_id }}
          EMITTED: ${{ steps.verdict.outputs.emitted }}
          HELD: ${{ steps.verdict.outputs.held }}
          BLOCKED: ${{ steps.verdict.outputs.blocked }}
          FLAGGED: ${{ steps.verdict.outputs.flagged }}
          RC: ${{ steps.verdict.outputs.rc }}
          REASON: ${{ steps.verdict.outputs.reason }}
          SOURCE_DOC: ${{ inputs.source_doc }}
          PIPE_REF: ${{ steps.pipe.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Content cycle ${CYCLE_ID} — ${SLUG}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pages emitted | **${EMITTED}** |"
            echo "| Held for curation (did NOT ship) | **${HELD}** |"
            echo "| Blocked / refused | **${BLOCKED}** |"
            echo "| Carrying warn flags | **${FLAGGED}** |"
            echo "| Emitter exit | \`${RC}\` — ${REASON} |"
            echo ""
            echo "Source document: \`${SOURCE_DOC}\`  ·  Pipeline ref: \`${PIPE_REF}\`"
            echo ""
            if [ "${HELD}" != "0" ]; then
              echo "> **${HELD} page(s) were HELD and are not in this PR.** See \`docs/briefs/_curation.md\` for the finding, the offending text and a proposed fix for each. Exit 15 is \"requires acknowledgement\", never green."
              echo ""
            fi
            echo "### What happens next"
            echo ""
            echo "This branch was opened by a workflow. **The quality gate runs on this PR** — 18 blocking checks against a real build, plus a preview URL. Nothing here is live until this PR is merged, and the merge is still a human decision."
            echo ""
            echo "Opened by \`cycle-emit.reusable.yml\`. It never pushes to \`main\`, never merges and never deploys."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/pr-body.md"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "::notice::Updated existing PR #${EXISTING}."
          else
            # BASE: normally the ref this run was dispatched on. The drive-poll
            # handoff stage dispatches ON the cycle branch itself (so the intake
            # DOCX is in the checkout and the emit commit ripens the intake PR);
            # in that case head == ref, and the base must be the default branch.
            BASE="${GITHUB_REF_NAME}"
            if [ "$BASE" = "$BRANCH" ]; then
              BASE="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
            fi
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "cycle(${SLUG}): ${CYCLE_ID} — ${EMITTED} page(s) emitted, ${HELD} held" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

      # --- Job summary: the same numbers, readable without opening the PR ------
      - name: Job summary
        if: always()
        env:
          SLUG: ${{ inputs.client_slug }}
          RAN: ${{ steps.claim.outputs.run }}
          DRY: ${{ inputs.dry_run }}
          RC: ${{ steps.verdict.outputs.rc }}
          PROCEED: ${{ steps.verdict.outputs.proceed }}
          REASON: ${{ steps.verdict.outputs.reason }}
          EMITTED: ${{ steps.verdict.outputs.emitted }}
          HELD: ${{ steps.verdict.outputs.held }}
          BLOCKED: ${{ steps.verdict.outputs.blocked }}
          FLAGGED: ${{ steps.verdict.outputs.flagged }}
          DISTILL: ${{ steps.distill.outputs.exit }}
          CLASSIFY: ${{ steps.classify.outputs.exit }}
          BRIEF: ${{ steps.brief.outputs.exit }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          if [ "${RAN}" != "true" ]; then
            {
              echo "## Cycle Emit — ${SLUG}"
              echo ""
              echo "**No-op.** \`emit\` was already marked done for this cycle by the other operator. Nothing was read, written or opened."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cycle Emit — ${SLUG}"
            echo ""
            echo "| Stage | Exit |"
            echo "|---|---|"
            echo "| distill | \`${DISTILL:-n/a}\` |"
            echo "| classify | \`${CLASSIFY:-n/a}\` |"
            echo "| brief | \`${BRIEF:-n/a}\` |"
            echo "| emit_ts | \`${RC:-n/a}\` |"
            echo ""
            echo "**Emitted ${EMITTED:-0} · held ${HELD:-0} · blocked ${BLOCKED:-0} · flagged ${FLAGGED:-0}**"
            echo ""
            echo "Verdict: ${REASON:-unknown}"
            echo ""
            if [ "${DRY}" = "true" ]; then
              echo "🔍 **DRY RUN** — the chain ran in full and NOTHING was committed, pushed or opened. Re-run with \`dry_run: false\` to open the PR."
            elif [ "${PROCEED}" = "true" ] && [ "${COMMITTED}" = "true" ]; then
              echo "✅ A \`cycle/\` branch was pushed and a PR opened. The quality gate runs on it. Nothing is live until it is merged."
            elif [ "${PROCEED}" = "true" ]; then
              echo "ℹ️ Nothing to commit — the emitter changed no files."
            else
              echo "🔴 **No PR was opened.** Download the \`cycle-emit-*\` artifact and read \`docs/briefs/_curation.md\` — it names the offending text and a proposed fix per page. Fix the source document and re-run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Fail the run on a refusal ------------------------------------------
      # Last, so the summary and the artifact always exist first. A refused cycle
      # must be RED: a green run that opened nothing reads as "nothing to do".
      - name: Fail on refusal
        if: always() && steps.claim.outputs.run == 'true' && steps.verdict.outputs.proceed != 'true'
        env:
          RC: ${{ steps.verdict.outputs.rc }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "::error::Cycle refused (emitter exit ${RC}): ${REASON}. No PR was opened. The fix list is in the run artifact (docs/briefs/_curation.md)."
          exit 1
